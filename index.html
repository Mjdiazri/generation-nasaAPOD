<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASA APOD</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header>
    <h1 class="nasa">NASA Astronomy Picture of the Day</h1>
  </header>

  <main class="container">
    <section class="apod-card">
      <div id="apod-content">
        <p>Cargando la imagen del día...</p>
      </div>
    </section>
  </main>

  <div class="fechas">
    <section class="buscarFecha" id="sectionBuscarFecha">
      <p class="descubre"> Descubre el universo </p>
      <label class="calendario">Elige una fecha:</label>
      <input type="date" id="calendario">
      <button type="submit" class="botonBuscarFecha" id="botonBuscarFecha">
        Buscar
      </button>
      <div class="fechasFuturas" id="fechasFuturas">
        <p> </p>

      </div>
    </section>

    <section class="fotoDia">
      <p>Tu Descubirmiento</p>
      <main class="container">
        <section class="apod-card">
          <div id="apod-content">
            <p>Cargando la imagen del día...</p>
          </div>
        </section>
      </main>

    </section>

  </div>


  <script src="./js/api.js"></script>
</body>

</html>
