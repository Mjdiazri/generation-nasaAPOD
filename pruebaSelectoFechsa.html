<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA APOD Viewer</title>
</head>
<body>

    <h1>Imagen Astronómica del Día (NASA)</h1>

    <!-- Filtro de Fecha -->
    <div class="buscador">
        <label for="fecha">Selecciona una fecha: </label>
        <input type="date" id="fecha">
        <button id="buscarFecha"">Buscar</button>
    </div>

    <!-- Contenedor de Resultados -->
    <div id="resultado" style="display:none;">
        <h2 id="titulo"></h2>
        <div id="contenedor-multimedia"></div>
        <div class="info">
            <p id="descripcion"></p>
        </div>
    </div>
    <script src="selectorFechas.js"></script>

</body>
